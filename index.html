<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin · Lernen Deutsch</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="titulo-login">
            <div class="eyebrow">Lernen Deutsch</div>
            <h1 id="titulo-login">Painel administrativo</h1>
            <p class="intro">Entre com a conta autorizada para gerenciar o conteúdo do site.</p>

            <form id="loginForm" class="login-form">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="username"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="entrar">Entrar</button>
            </form>

            <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>

            <div id="sessaoAtiva" class="sessao-ativa" hidden>
                <p>Login realizado com sucesso.</p>
                <button type="button" id="sair" class="secundario">Sair</button>
            </div>
        </section>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
